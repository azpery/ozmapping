# App iPad d'OZ Mapping, native (SwiftUI) : dessin, photos, chimie, Live et médias, avec les capteurs
# (inclinaison, secousses, micro) lus directement.
#
# Fabriquer le projet Xcode :   cd ipad && xcodegen
# Puis l'ouvrir :               open OZiPad.xcodeproj
# Dans Xcode : brancher l'iPad, ▶︎ (autre compte : changer DEVELOPMENT_TEAM ci-dessous).
name: OZiPad
options:
  bundleIdPrefix: app.ozmapping
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  OZiPad:
    type: application
    platform: iOS
    sources:
      - OZiPad
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.ozmapping.ipad
        PRODUCT_NAME: OZ Mapping
        TARGETED_DEVICE_FAMILY: "2"
        INFOPLIST_FILE: OZiPad/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: M9S9X5BRYT
