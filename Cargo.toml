[package]
name = "ozmapping"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "persistence", "wayland", "x11"] }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = "0.39.6"
tiny-skia = "0.12.0"
usvg = { version = "0.48.1", default-features = false }

[build-dependencies]
winresource = "0.1.34"
