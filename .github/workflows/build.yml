# Builds Windows et macOS.
# Lancement : onglet Actions > « Build » > « Run workflow », ou en poussant un tag « v* »
# (le tag publie aussi une release GitHub avec les fichiers).
name: Build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Tests
        run: cargo test --release

      - name: Compilation
        run: cargo build --release

      # ffmpeg est livré avec l'app : elle le cherche dans ffmpeg/bin à côté de l'exécutable.
      - name: Téléchargement de ffmpeg (BtbN, GPL)
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-src

      - name: Paquet
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $dir = "dist/OZ-Mapping"
          New-Item -ItemType Directory -Force "$dir/ffmpeg/bin" | Out-Null
          Copy-Item target/release/ozmapping.exe "$dir/OZ Mapping.exe"
          $src = (Get-ChildItem ffmpeg-src -Directory | Select-Object -First 1).FullName
          Copy-Item "$src/bin/ffmpeg.exe", "$src/bin/ffprobe.exe" "$dir/ffmpeg/bin/"
          Copy-Item "$src/LICENSE.txt" "$dir/ffmpeg/LICENSE.txt"
          Copy-Item README.md, assets/Phosphor-LICENSE-MIT.txt $dir
          $zip = "dist/OZ-Mapping-$version-windows-x64.zip"
          Compress-Archive -Path $dir -DestinationPath $zip
          "ZIP=$zip" >> $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: OZ-Mapping-windows-x64
          path: dist/OZ-Mapping

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP }}

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      - name: Tests
        run: cargo test --release

      - name: App universelle (Apple Silicon + Intel) et .dmg
        run: scripts/build-macos.sh --universal

      - uses: actions/upload-artifact@v4
        with:
          name: OZ-Mapping-macos
          path: dist/*.dmg

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
